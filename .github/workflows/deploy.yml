name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build User App
        working-directory: frontend/user-app
        env:
          VITE_API_URL: https://medifind-backend-253003075255.asia-south1.run.app
        run: |
          npm install
          npx --yes vite build

      - name: Build Shop App
        working-directory: frontend/shop-app
        env:
          VITE_API_URL: https://medifind-backend-253003075255.asia-south1.run.app
        run: |
          npm install
          npx --yes vite build

      - name: Combine builds
        run: |
          mkdir -p deploy/user deploy/shop
          cp -r frontend/user-app/dist/. deploy/user/
          cp -r frontend/shop-app/dist/. deploy/shop/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
